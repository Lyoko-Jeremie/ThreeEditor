		<script>

			window.toggleTheme = async function () {

				try {

					await window?.AppApiGroup?.toggleTheme?.();

				} catch ( e ) {
					// empty
				}

			};

			window.checkIsDark = () => window.matchMedia( '(prefers-color-scheme: dark)' ).matches;

			/**
			 * @param {string} s - The text to display in the confirmation dialog.
			 * @return {Promise<SweetAlertResult<Awaited<any>>>}
			 */
			window.SwalConfirm = function ( s ) {

				return Swal.fire( {
					// title: s.title || 'Are you sure?',
					text: s,
					// icon: s.icon || 'warning',
					showCancelButton: true,
					confirmButtonText: '是',
					cancelButtonText: '否',
					theme: window.checkIsDark() ? 'dark' : 'light',
				} );

			};

			/**
			 * @param {string} title - The text to display in the notice dialog.
			 * @return {Promise<SweetAlertResult<Awaited<any>>>}
			 */
			window.noticeDialog = function ( title ) {

				return Swal.fire( {
					// title: title,
					text: title,
					// showCancelButton: true,
					confirmButtonText: '确定',
					// cancelButtonText: 'Cancel',
					theme: window.checkIsDark() ? 'dark' : 'light',
				} );

			};

			/**
			 * @param {string} msg - The text to display in the alert dialog.
			 * @return {Promise<SweetAlertResult<Awaited<any>>>}
			 */
			window.alertDialog = function ( msg ) {

				return Swal.fire( {
					// title: msg,
					text: msg,
					// showCancelButton: true,
					confirmButtonText: '确定',
					// cancelButtonText: 'Cancel',
					icon: 'warning',
					theme: window.checkIsDark() ? 'dark' : 'light',
				} );

			};

			/**
			 * 显示可取消的保存等待对话框
			 * @param {string} message - 等待提示信息
			 * @param {function} onCancel - 取消回调函数
			 * @returns {Object} 包含关闭方法的对象
			 */
			window.showSaveWaitDialog = function ( message = '正在保存数据...', onCancel = null ) {

				let isCancelled = false;

				const swalInstance = Swal.fire( {
					text: message,
					html: `
            <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                <div class="swal2-loader" style="display: block;"></div>
                <div style="color: #888; font-size: 14px;">正在保存数据，请稍候...</div>
            </div>
        `,
					allowOutsideClick: false,
					allowEscapeKey: false,
					showConfirmButton: false,
					showCancelButton: false,
					// confirmButtonText: '取消操作',
					// confirmButtonColor: '#d33',
					theme: window.checkIsDark() ? 'dark' : 'light',
					customClass: {
						popup: 'save-wait-popup'
					},
					preConfirm: () => {

						isCancelled = true;
						if ( onCancel && typeof onCancel === 'function' ) {

							onCancel();

						}

						return false; // 阻止默认关闭行为

					}

				} );

				return {
					swalInstance: swalInstance,

					// 关闭对话框
					close: () => {

						if ( ! isCancelled ) {

							Swal.close();

						}

					},

					// 更新消息
					updateMessage: ( newMessage ) => {

						if ( ! isCancelled ) {

							Swal.update( {
								text: newMessage
							} );

						}

					},

					// 检查是否已取消
					isCancelled: () => isCancelled,

					// 成功完成
					success: ( message = '保存成功！' ) => {

						if ( ! isCancelled ) {

							Swal.fire( {
								text: message,
								icon: 'success',
								timer: 2000,
								showConfirmButton: false,
								theme: window.checkIsDark() ? 'dark' : 'light',
							} );

						}

					},

					// 失败处理
					error: ( message = '保存失败！' ) => {

						if ( ! isCancelled ) {

							Swal.fire( {
								text: '错误',
								text: message,
								icon: 'error',
								confirmButtonText: '确定',
								theme: window.checkIsDark() ? 'dark' : 'light',
							} );

						}

					},

				};

			};

			/**
			 * 显示输入对话框
			 * @param {string} title - 对话框标题
			 * @param {string} placeholder - 输入框占位符
			 * @param {string} defaultValue - 默认值
			 * @returns {Promise<string|undefined>} 返回用户输入的字符串或 undefined
			 */
			window.inputDialog = async function ( title, placeholder = '', defaultValue = '' ) {

				const result = await Swal.fire( {
					text: title,
					input: 'text',
					inputPlaceholder: placeholder,
					inputValue: defaultValue,
					showCancelButton: true,
					confirmButtonText: '确定',
					cancelButtonText: '取消',
					theme: window.checkIsDark() ? 'dark' : 'light',
					inputValidator: ( value ) => {

						if ( ! value ) {

							return '请输入内容';

						}

					}
				} );

				return result.isConfirmed ? result.value : undefined;

			};

		</script>

		<script type="module">

			import * as THREE from 'three';

			import { Editor } from './js/Editor.js';
			import { Viewport } from './js/Viewport.js';
			import { Toolbar } from './js/Toolbar.js';
			import { Script } from './js/Script.js';
			import { Player } from './js/Player.js';
			import { Sidebar } from './js/Sidebar.js';
			import { Menubar } from './js/Menubar.js';
			import { Resizer } from './js/Resizer.js';

			window.URL = window.URL || window.webkitURL;
			window.BlobBuilder = window.BlobBuilder || window.WebKitBlobBuilder || window.MozBlobBuilder;

			//

			const editor = new Editor();

			window.editor = editor; // Expose editor to Console
			window.THREE = THREE; // Expose THREE to APP Scripts and Console

			const viewport = new Viewport( editor );
			document.body.appendChild( viewport.dom );

			const toolbar = new Toolbar( editor );
			document.body.appendChild( toolbar.dom );

			const script = new Script( editor );
			document.body.appendChild( script.dom );

			const player = new Player( editor );
			document.body.appendChild( player.dom );

			const sidebar = new Sidebar( editor );
			document.body.appendChild( sidebar.dom );

			const menubar = new Menubar( editor );
			document.body.appendChild( menubar.dom );

			const resizer = new Resizer( editor );
			document.body.appendChild( resizer.dom );

			//

			editor.storage.init( function () {

				editor.storage.get( async function ( state ) {

					if ( isLoadingFromHash ) return;

					if ( state !== undefined ) {

						await editor.fromJSON( state );

					}

					const selected = editor.config.getKey( 'selected' );

					if ( selected !== undefined ) {

						editor.selectByUuid( selected );

					}

				} );

				//

				let timeout;

				function saveState() {

					if ( editor.config.getKey( 'autosave' ) === false ) {

						return;

					}

					clearTimeout( timeout );

					timeout = setTimeout( function () {

						editor.signals.savingStarted.dispatch();

						timeout = setTimeout( function () {

							editor.storage.set( editor.toJSON() );

							editor.signals.savingFinished.dispatch();

						}, 100 );

					}, 1000 );

				}

				const signals = editor.signals;

				signals.geometryChanged.add( saveState );
				signals.objectAdded.add( saveState );
				signals.objectChanged.add( saveState );
				signals.objectRemoved.add( saveState );
				signals.materialChanged.add( saveState );
				signals.sceneBackgroundChanged.add( saveState );
				signals.sceneEnvironmentChanged.add( saveState );
				signals.sceneFogChanged.add( saveState );
				signals.sceneGraphChanged.add( saveState );
				signals.scriptChanged.add( saveState );
				signals.historyChanged.add( saveState );

				window.saveEditorState = saveState;

			} );

			//

			document.addEventListener( 'dragover', function ( event ) {

				event.preventDefault();
				event.dataTransfer.dropEffect = 'copy';

			} );

			document.addEventListener( 'drop', function ( event ) {

				event.preventDefault();

				if ( event.dataTransfer.types[ 0 ] === 'text/plain' ) return; // Outliner drop

				if ( event.dataTransfer.items ) {

					// DataTransferItemList supports folders

					editor.loader.loadItemList( event.dataTransfer.items );

				} else {

					editor.loader.loadFiles( event.dataTransfer.files );

				}

			} );

			function onWindowResize() {

				editor.signals.windowResize.dispatch();

			}

			window.addEventListener( 'resize', onWindowResize );

			onWindowResize();

			//

			let isLoadingFromHash = false;
			const hash = window.location.hash;

			! ( async function () {

				if ( hash.slice( 1, 6 ) === 'file=' ) {

					const file = hash.slice( 6 );

					if ( ( await SwalConfirm( editor.strings.getKey( 'prompt/file/open' ) ) ).isConfirmed ) {

						const loader = new THREE.FileLoader();
						loader.crossOrigin = '';
						loader.load( file, function ( text ) {

							editor.clear();
							editor.fromJSON( JSON.parse( text ) );

						} );

						isLoadingFromHash = true;

					}

				}

			} )();


			// ServiceWorker

			// if ( 'serviceWorker' in navigator ) {

			//

			//

			//
			// }

		</script>
